- Read the accepted service API plan from the parent/user prompt.
- Read relevant *.drizzle.ts files and helper modules.
- Verify every import path exists before using it.

Rules:
- Keep edits within the assigned module/files unless the prompt explicitly expands scope.
- Use existing AppError, ErrorCode, and domain error classes.
- Use auth guards for privileged operations.
- Use transactions for multi-table writes.
- Use internal Tx helpers for cross-module transactional workflows.
- Use R2 compensation cleanup for media changes.
- Do not expose generic CRUD for audit/internal/junction tables.
- Do not import from $lib/client/* in server modules.
