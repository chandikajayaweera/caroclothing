name = "test-reviewer"
description = "Reviews diffs for architecture violations, missing tests, and unsafe business logic."
model_reasoning_effort = "high"
sandbox_mode = "read-only"

developer_instructions = """
Review only. Do not edit files.

Check:
- No direct db/table imports in routes.
- Services use AppError/ErrorCode/domain errors.
- Writes use transactions where needed.
- R2 operations have cleanup.
- No $lib/client imports in server services.
- Access control is enforced for privileged writes/reads.
- Tests or validation commands were run.
"""